# 手動或推 tag 時在 Windows 打包 exe，產物是 prop-journal-windows.zip
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pyinstaller
      - run: python -m PyInstaller build.spec --noconfirm
        working-directory: backend
      - run: Copy-Item "給朋友的說明.txt" backend/dist/prop-journal/
      - uses: actions/upload-artifact@v4
        with:
          name: prop-journal-windows
          path: backend/dist/prop-journal
